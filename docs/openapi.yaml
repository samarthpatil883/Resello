openapi: 3.0.3
info:
  title: Resello API
  version: 1.0.0
  description: Single source of truth for the Resello API.
servers:
  - url: /
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: accessToken
  parameters:
    pageParam:
      name: page
      in: query
      schema:
        type: integer
        default: 1
    limitParam:
      name: limit
      in: query
      schema:
        type: integer
        default: 10
  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
    User:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        email: { type: string }
        role: { type: string, enum: [STUDENT, ADMIN] }
        emailVerifiedAt: { type: string, nullable: true }
        lastActiveMode: { type: string, enum: [BUY, SELL] }
        sellerOnboardedAt: { type: string, nullable: true }
        campusLocation: { $ref: '#/components/schemas/GeoJSONPoint' }
        pickupPreference:
          { type: string, enum: [ON_CAMPUS, HOSTEL_GATE, DEPARTMENT], nullable: true }
        phone: { type: string, nullable: true }
        isSuspended: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    GeoJSONPoint:
      type: object
      properties:
        type: { type: string, enum: [Point] }
        coordinates:
          type: array
          items: { type: number }
          description: '[lng, lat]'
    Category:
      type: object
      properties:
        _id: { type: string }
        name: { type: string }
        slug: { type: string }
        icon: { type: string }
    Listing:
      type: object
      properties:
        _id: { type: string }
        seller: { $ref: '#/components/schemas/User' }
        title: { type: string }
        category: { $ref: '#/components/schemas/Category' }
        condition: { type: string, enum: [NEW, LIKE_NEW, GOOD, FAIR, POOR] }
        price: { type: number }
        description: { type: string }
        images:
          type: array
          items: { $ref: '#/components/schemas/ProductImage' }
        location: { $ref: '#/components/schemas/GeoJSONPoint' }
        status: { type: string, enum: [ACTIVE, PENDING, SOLD, REMOVED] }
        createdAt: { type: string }
        updatedAt: { type: string }
    Item:
      type: object
      required: [id, seller_id, title, description, price, image_url, image_urls, created_at]
      properties:
        id: { type: string, description: MongoDB item ID }
        seller_id: { type: string, description: MongoDB ID of the verified seller }
        title: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        price: { type: number, minimum: 0.01 }
        image_url: { type: string, description: API-relative URL for the first item image }
        image_urls:
          type: array
          description: API-relative URLs in seller upload order, up to five images
          items: { type: string }
        condition: { type: string, enum: [NEW, LIKE_NEW, GOOD, FAIR, POOR] }
        distance_km:
          type: number
          description: Approximate distance from the buyer's requested location; present for distance-filtered results.
        status: { type: string, enum: [ACTIVE, PENDING, SOLD, REMOVED] }
        created_at: { type: string, format: date-time }
    ProductImage:
      type: object
      properties:
        url: { type: string }
        publicId: { type: string }
        width: { type: integer }
        height: { type: integer }
    Cart:
      type: object
      properties:
        _id: { type: string }
        user: { $ref: '#/components/schemas/User' }
        items:
          type: array
          items: { $ref: '#/components/schemas/CartItem' }
    CartItem:
      type: object
      properties:
        listing: { $ref: '#/components/schemas/Listing' }
        addedAt: { type: string }
    Order:
      type: object
      properties:
        _id: { type: string }
        listing: { $ref: '#/components/schemas/Listing' }
        buyer: { $ref: '#/components/schemas/User' }
        seller: { $ref: '#/components/schemas/User' }
        price: { type: number }
        status: { type: string, enum: [PLACED, CONFIRMED, COMPLETED, CANCELLED] }
        completionApprovals:
          type: object
          properties:
            buyer: { type: boolean }
            seller: { type: boolean }
        payment: { $ref: '#/components/schemas/Payment' }
        deliveryNotes: { type: string }
        cancelReason: { type: string }
        createdAt: { type: string }
        updatedAt: { type: string }
    Payment:
      type: object
      properties:
        _id: { type: string }
        order: { $ref: '#/components/schemas/Order' }
        method: { type: string, enum: [ONLINE, COD] }
        status: { type: string, enum: [PENDING, COMPLETED, FAILED, PENDING_COLLECTION] }
        amount: { type: number }
        transactionRef: { type: string }
        razorpayOrderId: { type: string }
        razorpayPaymentId: { type: string }
        createdAt: { type: string }
    Message:
      type: object
      properties:
        _id: { type: string }
        sender: { $ref: '#/components/schemas/User' }
        recipient: { $ref: '#/components/schemas/User' }
        listing: { $ref: '#/components/schemas/Listing' }
        content: { type: string }
        readAt: { type: string }
        createdAt: { type: string }
    Review:
      type: object
      properties:
        _id: { type: string }
        order: { $ref: '#/components/schemas/Order' }
        reviewer: { $ref: '#/components/schemas/User' }
        seller: { $ref: '#/components/schemas/User' }
        rating: { type: integer }
        comment: { type: string }
        createdAt: { type: string }
    WishlistItem:
      type: object
      properties:
        _id: { type: string }
        user: { $ref: '#/components/schemas/User' }
        listing: { $ref: '#/components/schemas/Listing' }
        addedAt: { type: string }
    Notification:
      type: object
      properties:
        _id: { type: string }
        user: { $ref: '#/components/schemas/User' }
        type: { type: string }
        title: { type: string }
        body: { type: string }
        mode: { type: string, enum: [BUY, SELL] }
        relatedId: { type: string }
        readAt: { type: string }
        createdAt: { type: string }
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                password: { type: string }
                confirmPassword: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: 'VERIFICATION_REQUIRED' }
                  resendAvailableInSec: { type: integer }
        '400':
          description: Validation error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Email taken
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/verify-email:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                code: { type: string }
      responses:
        '200':
          description: Verified
          headers:
            Set-Cookie:
              description: HttpOnly access and refresh session cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: OTP error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/resend-otp:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                purpose: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  resendAvailableInSec: { type: integer }
        '429':
          description: Rate limited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/login:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: OK
          headers:
            Set-Cookie:
              description: HttpOnly access and refresh session cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
        '400':
          description: Domain error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Email not verified / suspended
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/auth/logout:
    post:
      tags: [Auth]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
  /api/auth/refresh:
    post:
      tags: [Auth]
      responses:
        '200':
          description: Session rotated
          headers:
            Set-Cookie:
              description: Rotated HttpOnly access and refresh session cookies.
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
  /api/auth/forgot-password:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /api/auth/reset-password:
    post:
      tags: [Auth]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                code: { type: string }
                newPassword: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
  /api/auth/me:
    get:
      tags: [Auth]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: '#/components/schemas/User' }
                  badgeCounts:
                    type: object
                    properties:
                      buy: { type: integer }
                      sell: { type: integer }
  /api/me/mode:
    patch:
      tags: [Account]
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                mode: { type: string, enum: [BUY, SELL] }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  lastActiveMode: { type: string }
  /api/me/seller-onboarding:
    post:
      tags: [Account]
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                campusLocation: { $ref: '#/components/schemas/GeoJSONPoint' }
                pickupPreference: { type: string }
                phone: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  sellerOnboardedAt: { type: string }
  /api/me/seller-stats:
    get:
      tags: [Account]
      summary: Get the authenticated seller's dashboard statistics
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Live listing, sales-order, and seller-rating summary
          content:
            application/json:
              schema:
                type: object
                required:
                  [activeListings, needsYourAction, completedSales, averageRating, ratingCount]
                properties:
                  activeListings: { type: integer, minimum: 0 }
                  needsYourAction:
                    { type: integer, minimum: 0, description: Seller orders with status PLACED }
                  completedSales:
                    { type: integer, minimum: 0, description: Seller orders with status COMPLETED }
                  averageRating:
                    type: number
                    nullable: true
                    description: Average review score; null until seller reviews are available.
                  ratingCount:
                    {
                      type: integer,
                      minimum: 0,
                      description: Number of reviews contributing to averageRating,
                    }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/me/badges:
    get:
      tags: [Account]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  buy: { type: integer }
                  sell: { type: integer }
  /api/listings:
    get:
      tags: [Listings]
      parameters:
        - name: search
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: minPrice
          in: query
          schema: { type: number }
        - name: maxPrice
          in: query
          schema: { type: number }
        - name: condition
          in: query
          schema: { type: string }
        - name: maxDistance
          in: query
          schema: { type: number }
        - name: minRating
          in: query
          schema: { type: number }
        - name: sort
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/pageParam'
        - $ref: '#/components/parameters/limitParam'
        - name: excludeMine
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items: { $ref: '#/components/schemas/Listing' }
                  total: { type: integer }
                  page: { type: integer }
                  totalPages: { type: integer }
  /api/listings/nearby:
    get:
      tags: [Listings]
      parameters:
        - name: lat
          in: query
          schema: { type: number }
        - name: lng
          in: query
          schema: { type: number }
        - name: maxDistance
          in: query
          schema: { type: number }
        - name: limit
          in: query
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  listings:
                    type: array
                    items: { $ref: '#/components/schemas/Listing' }
  /api/listings/{id}:
    get:
      tags: [Listings]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Listing' }
        '404':
          description: Not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/cart/items:
    get:
      tags: [Cart]
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                  total: { type: number }
    post:
      tags: [Cart]
      security:
        - cookieAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                listingId: { type: string }
      responses:
        '201':
          description: Created
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/cart/items/{listingId}:
    delete:
      tags: [Cart]
      security:
        - cookieAuth: []
      parameters:
        - name: listingId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
  /api/checkout:
    post:
      tags: [Checkout]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itemIds, paymentMethod]
              properties:
                itemIds:
                  type: array
                  minItems: 1
                  maxItems: 25
                  items: { type: string }
                paymentMethod: { type: string, enum: [COD] }
                deliveryNotes: { type: string, maxLength: 500 }
      responses:
        '201':
          description: COD orders created after active items were atomically reserved
          content:
            application/json:
              schema:
                type: object
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      required: [id, itemId, title, price, status, paymentMethod, paymentStatus]
                      properties:
                        id: { type: string }
                        itemId: { type: string }
                        title: { type: string }
                        price: { type: number }
                        status: { type: string, enum: [PLACED] }
                        paymentMethod: { type: string, enum: [COD] }
                        paymentStatus: { type: string, enum: [PENDING_COLLECTION] }
        '400':
          description: Invalid checkout request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: One or more items are no longer available
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/orders:
    get:
      tags: [Orders]
      summary: Get the authenticated user's orders as buyer or seller
      security:
        - cookieAuth: []
      parameters:
        - name: side
          in: query
          required: true
          schema: { type: string, enum: [buyer, seller] }
      responses:
        '200':
          description: Orders associated with the authenticated user on the requested side
          content:
            application/json:
              schema:
                type: object
                required: [orders]
                properties:
                  orders:
                    type: array
                    items:
                      type: object
                      required: [id, itemId, title, price, status, completionApprovals, rating]
                      properties:
                        id: { type: string }
                        itemId: { type: string }
                        title: { type: string }
                        price: { type: number }
                        status: { type: string, enum: [PLACED, CONFIRMED, COMPLETED, CANCELLED] }
                        completionApprovals:
                          type: object
                          required: [buyer, seller]
                          properties:
                            buyer: { type: boolean }
                            seller: { type: boolean }
                        rating: { type: integer, nullable: true, minimum: 1, maximum: 5 }
        '400':
          description: Invalid order side
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/orders/{orderId}/completion-approval:
    post:
      tags: [Orders]
      summary: Approve item handover completion as the buyer or seller on the order
      description: The order moves to COMPLETED only after both its buyer and seller approve.
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The caller's approval was recorded; returns updated order status and approvals
          content:
            application/json:
              schema:
                type: object
                required: [orderId, status, completionApprovals]
                properties:
                  orderId: { type: string }
                  status: { type: string, enum: [PLACED, CONFIRMED, COMPLETED] }
                  completionApprovals:
                    type: object
                    required: [buyer, seller]
                    properties:
                      buyer: { type: boolean }
                      seller: { type: boolean }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Caller is not the buyer or seller on this order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: Order was cancelled or otherwise cannot be completed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/orders/{orderId}/rating:
    post:
      tags: [Orders]
      summary: Rate the seller after both parties complete an order
      security:
        - cookieAuth: []
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating: { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Seller rating recorded for the completed order
        '400':
          description: Invalid rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Only the buyer on a completed order may rate the seller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Order not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '409':
          description: The order already has a rating
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /api/items/{itemId}:
    get:
      tags: [Items]
      security:
        - cookieAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Item details, including its current availability
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Item not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    patch:
      tags: [Items]
      summary: Edit an active listing owned by the authenticated seller
      description: Reserved, sold, and removed listings cannot be edited. New photos append to the existing gallery.
      security:
        - cookieAuth: []
      parameters:
        - name: itemId
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, price, condition]
              properties:
                title: { type: string, minLength: 2, maxLength: 120 }
                description: { type: string, minLength: 1, maxLength: 2000 }
                price: { type: number, minimum: 0.01, maximum: 10000000 }
                condition: { type: string, enum: [NEW, LIKE_NEW, GOOD, FAIR, POOR] }
                images:
                  type: array
                  description: Optional additional JPEG, PNG, or WebP photos, up to five photos total and 15 MiB total.
                  maxItems: 5
                  items:
                    type: string
                    format: binary
            encoding:
              images:
                style: form
                explode: true
      responses:
        '200':
          description: Updated listing
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '400':
          description: Invalid listing fields or image
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '404':
          description: Listing not found or not owned by the seller
          content:
