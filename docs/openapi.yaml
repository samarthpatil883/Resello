  /api/items:
    get:
      tags: [Items]
      security:
        - cookieAuth: []
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
        - name: minPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: maxPrice
          in: query
          schema: { type: number, minimum: 0 }
        - name: condition
          in: query
          schema: { type: string, enum: [NEW, LIKE_NEW, GOOD, FAIR, POOR] }
        - name: newOnly
          in: query
          description: Restrict results to listings published in the past seven days.
          schema: { type: boolean, default: false }
        - name: maxDistanceKm
          in: query
          description: Maximum distance from the supplied buyer location, in kilometers.
          schema: { type: number, minimum: 0.1, maximum: 100 }
        - name: latitude
          in: query
          description: Buyer location latitude; required with longitude for distance filtering or nearest sorting.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: longitude
          in: query
          description: Buyer location longitude; required with latitude for distance filtering or nearest sorting.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: sort
          in: query
          schema: { type: string, enum: [newest, price_asc, price_desc, nearest], default: newest }
      responses:
        '200':
          description: Active items from other verified campus sellers matching the optional search filters
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Item' }
        '400':
          description: Invalid filter values or a missing buyer location for distance filtering
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
    post:
      tags: [Items]
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [title, description, price, condition, images]
              properties:
                title: { type: string, maxLength: 120 }
                description: { type: string, maxLength: 2000 }
                price: { type: number, minimum: 0.01 }
                condition: { type: string, enum: [NEW, LIKE_NEW, GOOD, FAIR, POOR] }
                images:
                  type: array
                  description: Repeat this field for up to five JPEG, PNG, or WebP images (5 MiB each, 15 MiB total).
                  maxItems: 5
                  items:
                    type: string
                    format: binary
            encoding:
              images:
                style: form
                explode: true
      responses:
        '201':
          description: Item created
          content:
            application/json:
              schema:
                type: object
                required: [item]
                properties:
                  item: { $ref: '#/components/schemas/Item' }
        '400':
          description: Invalid item or uploaded image
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '413':
          description: An image exceeds 5 MiB or the combined photo size exceeds 15 MiB
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Authentication required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Seller onboarding required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
