name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Start local services
        run: |
          cp server/.env.example server/.env
          docker compose up -d mongo mailpit
          for attempt in {1..30}; do
            if docker compose exec -T mongo mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
              echo "MongoDB is ready."
              exit 0
            fi
            echo "Waiting for MongoDB ($attempt/30)..."
            sleep 2
          done
          docker compose logs mongo mailpit
          echo "MongoDB did not become ready within 60 seconds."
          exit 1
      - run: npm run build
      - run: npm run lint
      - run: npm run lint:openapi
      - run: npm test --workspace=server -- --runInBand
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - run: npm run test --workspace=e2e
