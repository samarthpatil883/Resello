services:
  mongo:
    image: mongo:7
    container_name: resello-mongo
    ports:
      - '27017:27017'
    volumes:
      - resello-mongo-data:/data/db
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit
    container_name: resello-mailpit
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8026:8025' # Native Mailpit UI
    restart: unless-stopped

  mailpit-inbox:
    image: nginx:alpine
    container_name: resello-mailpit-inbox
    ports:
      - '127.0.0.1:8025:80' # Gmail-inspired local inbox
    volumes:
      - ./mailpit-ui:/usr/share/nginx/html:ro
      - ./mailpit-ui/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - mailpit
    restart: unless-stopped

volumes:
  resello-mongo-data:
